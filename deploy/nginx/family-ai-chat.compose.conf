# Docker Compose edge: TLS termination + dynamic IP gate.
# The allowlist lives in PostgreSQL. Nginx asks the app's own gate about every
# request through auth_request, so adding/removing an IP takes effect immediately
# (app cache: IP_CACHE_MS) without reloading Nginx.

server_tokens off;
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;

log_format family '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    set $app_backend "app:3000";

    access_log /var/log/nginx/family-ai-chat.access.log family;
    error_log  /var/log/nginx/family-ai-chat.error.log warn;

    client_max_body_size 25m;
    client_body_timeout 60s;

    # Everything arrives through proxy_pass, and nginx's default is
    # "gzip_proxied off", which compresses no proxied response at all.
    # text/html is always included by nginx; text/event-stream is deliberately
    # absent so streamed chat replies stay unbuffered.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/manifest+json application/xml image/svg+xml font/ttf;

    # Internal authorization subrequest. It reaches the app through its normal
    # IP gate; 2xx means allowlisted, 403/5xx means denied (fail closed).
    location = /_ip_gate {
        internal;
        proxy_pass http://$app_backend/api/health;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        include /etc/nginx/proxy-common.conf;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    # Tight rate limit on credential endpoints (in addition to app-side limits).
    location ~ ^/api/auth/(login|register/request|register/verify|password/forgot|password/reset)$ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        auth_request /_ip_gate;
        include /etc/nginx/proxy-common.conf;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://$app_backend;
    }

    location / {
        auth_request /_ip_gate;
        include /etc/nginx/proxy-common.conf;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://$app_backend;
    }

    location @deny {
        default_type text/html;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        return 403 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>403 · Access denied</title><style>html,body{height:100%;margin:0}body{background:#07090f;color:#e7ecf5;display:grid;place-items:center;font-family:-apple-system,Segoe UI,sans-serif}.box{text-align:center;padding:32px;max-width:520px}h1{font-size:20px;font-weight:600;margin:0 0 12px}p{color:#8b96a9;font-size:14px;line-height:1.7;margin:0}</style></head><body><div class="box"><h1>Access denied</h1><p>当前网络地址不在访问白名单中。此站点仅允许经服务器所有者授权的 IP 访问。</p></div></body></html>';
    }

    location @rate_limited {
        default_type text/plain;
        return 429 'Too many authentication attempts. Please wait and try again.';
    }

    error_page 403 = @deny;
    error_page 429 = @rate_limited;
}
