name: family-ai-chat

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_chat
      POSTGRES_USER: family_chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_chat -d family_chat"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: "postgresql://family_chat:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/family_chat?schema=public&connection_limit=8&pool_timeout=10"
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      # Only the Nginx container may assert X-Real-IP. Keep in sync with the network below.
      TRUSTED_PROXY_CIDRS: 172.28.0.10/32
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
      TMPDIR: /tmp
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    networks:
      - internal

  nginx:
    image: family-ai-chat-nginx:local
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/family-ai-chat.compose.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/proxy-common.conf:/etc/nginx/proxy-common.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      internal:
        ipv4_address: 172.28.0.10

volumes:
  db_data:
  uploads:
  backups:
  nginx_logs:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
